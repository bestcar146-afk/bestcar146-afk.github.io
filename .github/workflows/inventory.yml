name: Sync Encar inventory
on:
  push:
    branches: [main]
    paths: [index.html, live.js, scripts/sync_inventory.py, .github/workflows/inventory.yml]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: inventory-pages
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch inventory
        id: fetch
        continue-on-error: true
        env:
          XAPI_KEY: ${{ secrets.XAPI_KEY }}
        run: python scripts/sync_inventory.py
      - name: Save successful snapshot
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Encar inventory"
            git push
          fi
      - name: Prepare public website only
        run: |
          mkdir -p _site
          cp index.html live.js _site/
          if [ -f inventory.json ]; then cp inventory.json _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
      - name: Report sync failure
        if: steps.fetch.outcome != 'success'
        run: |
          echo "Inventory refresh failed. Previous snapshot or clearly labelled demo remains available."
          exit 1
