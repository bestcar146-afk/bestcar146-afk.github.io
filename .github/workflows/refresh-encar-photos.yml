name: Refresh Encar photo galleries

on:
  push:
    branches: [main]
    paths:
      - scripts/refresh_encar_photos.py
      - scripts/sync_inventory.py
      - .github/workflows/refresh-encar-photos.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: encar-photo-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh full Encar galleries
        env:
          ENCARAPI_KEY: ${{ secrets.ENCARAPI_KEY }}
        run: python scripts/refresh_encar_photos.py

      - name: Save refreshed galleries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh full Encar photo galleries"
            if ! git push; then
              git pull --rebase origin main
              git push
            fi
          fi
