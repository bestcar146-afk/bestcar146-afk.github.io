name: Update USD-KRW rate

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: write

jobs:
  update-fx:
    runs-on: ubuntu-latest
    # Never generate a failed workflow notification just because an external FX page changed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Update USD-KRW rate
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request, html as html_lib
          from datetime import datetime, timezone
          from pathlib import Path

          def valid_rate(value):
              try:
                  value = float(value)
              except Exception:
                  return None
              return value if 500 < value < 3000 else None

          def google_rate():
              urls = [
                  "https://www.google.com/finance/beta/quote/USD-KRW?hl=en",
                  "https://www.google.com/finance/quote/USD-KRW?hl=en",
              ]
              headers = {
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36",
                  "Accept-Language": "en-US,en;q=0.9",
              }
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      page = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")

                      patterns = [
                          r'data-last-price=["\']([0-9,.]+)',
                          r'class=["\']YMlKec[^"\']*["\'][^>]*>\s*([^<]+)<',
                      ]
                      for pattern in patterns:
                          m = re.search(pattern, page, re.I)
                          if m:
                              raw = re.sub(r"[^0-9.]", "", m.group(1).replace(",", ""))
                              rate = valid_rate(raw)
                              if rate:
                                  return rate, "Google Finance", url

                      # Google Finance moved to a beta page and its CSS class names can change.
                      # Parse the visible text near the USD/KRW title instead of relying on one class.
                      text = html_lib.unescape(re.sub(r"<[^>]+>", " ", page))
                      text = re.sub(r"\s+", " ", text)
                      anchors = [
                          "United States Dollar / South Korean won",
                          "USD / KRW",
                          "USD/KRW",
                      ]
                      for anchor in anchors:
                          pos = text.lower().find(anchor.lower())
                          if pos < 0:
                              continue
                          chunk = text[pos:pos + 900]
                          for raw in re.findall(r"(?<![0-9])([0-9]{3,4}(?:,[0-9]{3})*(?:\.[0-9]+)?)(?![0-9])", chunk):
                              rate = valid_rate(raw.replace(",", ""))
                              if rate:
                                  return rate, "Google Finance", url
                  except Exception as exc:
                      print("Google Finance attempt failed:", type(exc).__name__)
              return None

          def fallback_rate():
              # Public no-key fallback used only if Google changes its page again.
              url = "https://open.er-api.com/v6/latest/USD"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              data = json.load(urllib.request.urlopen(req, timeout=30))
              rate = valid_rate((data.get("rates") or {}).get("KRW"))
              if not rate:
                  raise ValueError("Fallback returned no valid KRW rate")
              return rate, "ExchangeRate-API fallback", url

          result = google_rate()
          if result is None:
              try:
                  result = fallback_rate()
                  print("Google Finance parser unavailable; used fallback rate source.")
              except Exception as exc:
                  print("FX refresh unavailable:", exc)
                  print("Keeping the existing fx.json so the website continues using the last good rate.")
                  raise SystemExit(0)

          rate, source, source_url = result
          out = {
              "pair": "USD/KRW",
              "krw_per_usd": round(rate, 4),
              "source": source,
              "source_url": source_url,
              "as_of": datetime.now(timezone.utc).isoformat(),
          }
          Path("fx.json").write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(out)
          PY

      - name: Commit rate if changed
        shell: bash
        run: |
          if git diff --quiet -- fx.json; then
            echo "No FX change"
            exit 0
          fi

          git config user.name "bestcarstar-fx-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fx.json
          git commit -m "Update USD-KRW rate"

          # Do not fail the workflow if another website update lands at the same moment.
          if ! git push; then
            echo "First push conflicted; rebasing once."
            if git pull --rebase origin main && git push; then
              echo "FX update pushed after rebase."
            else
              echo "FX push skipped. The next scheduled run will retry automatically."
              exit 0
            fi
          fi
