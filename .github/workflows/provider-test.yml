name: Inspect vehicle detail fields
on:
  push:
    branches: [main]
    paths: [.github/workflows/provider-test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public vehicle specification fields
        env:
          ENCARAPI_KEY: ${{ secrets.ENCARAPI_KEY }}
        run: |
          python -u - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.environ['ENCARAPI_KEY']
          for path in ['/api/vehicle/42799351?lang=en','/api/inspection/42799351','/api/record/42799351']:
              try:
                  req=urllib.request.Request('https://api.encarapi.com'+path,headers={'x-api-key':key})
                  with urllib.request.urlopen(req,timeout=120) as r: d=json.load(r)
                  print('PATH',path,'FIELDS',list(d),flush=True)
                  if '/vehicle/' in path:
                      print('SPEC',json.dumps(d.get('spec'),ensure_ascii=False))
                      print('CATEGORY',json.dumps(d.get('category'),ensure_ascii=False))
                      print('CONDITION',json.dumps(d.get('condition'),ensure_ascii=False))
                      print('PHOTO',json.dumps((d.get('photos') or [])[:1],ensure_ascii=False))
                  elif '/inspection/' in path:
                      m=d.get('master') or {}
                      print('MASTER',json.dumps({k:v for k,v in m.items() if k!='detail'},ensure_ascii=False))
                      print('DETAIL_KEYS',list((m.get('detail') or {})))
                  else:
                      print('RECORD',json.dumps({k:v for k,v in d.items() if k.endswith('Cnt') or k.endswith('Cost')},ensure_ascii=False))
              except urllib.error.HTTPError as e: print('HTTP',e.code)
          PY
