name: Refresh Kolon auction inventory
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['auction/scripts/update_kolon.py', '.github/workflows/auction-kolon.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: inventory-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Kolon API inventory
        id: kolon
        continue-on-error: false
        run: python auction/scripts/update_kolon.py
      - name: Save complete Kolon snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auction/index.html auction/kolon-refresh.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Kolon auction inventory"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Package existing public website
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='node_modules/' --exclude='scripts/' --exclude='src/' --exclude='sql/' --exclude='qa/' --exclude='__pycache__/' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
      - name: Report failed Kolon check
        if: steps.kolon.outcome == 'failure'
        run: exit 1
